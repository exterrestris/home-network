---
- name: Bootstrap host not in inventory
  hosts: localhost
  gather_facts: false
  tags: bootstrap-new
  tasks:
    - name: IP address to bootstrap
      ansible.builtin.pause:
        prompt:
        echo: true
      register: target_host
    - name: Add host
      ansible.builtin.add_host:
        name: "{{ target_host.user_input }}"
        groups: setup
      changed_when: false

- name: Bootstrap single host from inventory
  hosts: localhost
  gather_facts: false
  tags: bootstrap-host
  tasks:
    - name: Inventory host to bootstrap
      ansible.builtin.pause:
        prompt:
        echo: true
      register: target_host
    - name: Verify host exists
      ansible.builtin.assert:
        fail_msg: "{{ target_host.user_input | replace('-', '_') }} is not a valid host in the inventory"
        that: (target_host.user_input | replace('-', '_')) in hostvars
    - name: Add host
      ansible.builtin.add_host:
        name: "{{ target_host.user_input | replace('-', '_') }}"
        groups: setup
      changed_when: false

- name: Bootstrap group from inventory
  hosts: localhost
  gather_facts: false
  tags: bootstrap-group
  tasks:
    - name: Inventory group to bootstrap
      ansible.builtin.pause:
        prompt:
        echo: true
      register: target_host
    - name: Verify group exists
      ansible.builtin.assert:
        fail_msg: "{{ target_host.user_input | replace('-', '_') }} is not a valid group in the inventory"
        that: (target_host.user_input | replace('-', '_')) in groups
    - name: Add hosts from group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: setup
      loop: "{{ groups[(target_host.user_input | replace('-', '_'))] }}"
      changed_when: false

- name: Bootstrap all hosts in inventory
  hosts: localhost
  gather_facts: false
  tags: bootstrap-all
  tasks:
    - name: Add all hosts
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: setup
      loop: "{{ groups.all }}"

- name: Check Ansible can connect
  hosts: setup
  gather_facts: false
  serial: 1
  tags:
    - bootstrap-new
    - bootstrap-host
    - bootstrap-group
    - bootstrap-all
  tasks:
    - name: Check Ansible user
      ansible.builtin.include_tasks: tasks/check-ansible-user.yaml

- name: Configure Python interpreter
  hosts: setup
  gather_facts: false
  tags: bootstrap-new
  tasks:
    - name: Prompt for Python interpreter path
      ansible.builtin.pause:
        prompt: "Path to Python interpreter (Current: auto detect)"
        echo: true
      register: python
    - name: Set Python interpreter
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ python.user_input }}"
      when: python.user_input != ''

- name: Bootstrap host(s)
  hosts: setup
  tags:
    - bootstrap-new
    - bootstrap-host
    - bootstrap-group
    - bootstrap-all
  tasks:
    - name: Include bootstrap tasks
      ansible.builtin.include_tasks: tasks/setup.yaml

- name: Set hostname for host
  hosts: setup
  tags:
    - bootstrap-new
    - bootstrap-host
  tasks:
    - name: Prompt for desired hostname
      ansible.builtin.pause:
        prompt: "Desired hostname (Current: {{ ansible_hostname }})"
        echo: true
      register: hostname
    - name: Set hostname
      ansible.builtin.hostname:
        name: "{{ hostname.user_input }}"
      when: hostname.user_input != ''
