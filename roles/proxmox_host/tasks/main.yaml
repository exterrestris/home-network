---
# Protects against SSD wear
- name: Disable cluster services
  ansible.builtin.service:
    name: "{{ item.name }}"
    state: stopped
    enabled: false
  with_items: "{{ proxmox_host_cluster_services }}"
  when: not proxmox_host_cluster_services_enabled

- name: Enable cluster services
  ansible.builtin.service:
    name: "{{ item.name }}"
    state: started
    enabled: true
  with_items: "{{ proxmox_host_cluster_services }}"
  when: proxmox_host_cluster_services_enabled
