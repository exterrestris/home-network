---
- name: Verify WSL environment
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: Verify WSL environment
      ansible.builtin.assert:
        that:
          - lookup('env', 'WSL_DISTRO_NAME') != ""

- name: Configure WSL
  hosts: localhost
  become: true
  gather_facts: false
  connection: local
  tasks:
    # Install packages
    - name: Install common packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ common_packages }}"

    # Generate SSH key
    - name: Generate ssh key
      ansible.builtin.user:
        name: "{{ main_user.username }}"
        group: "{{ main_user.username }}"
        shell: /bin/zsh
        generate_ssh_key: true
        ssh_key_type: ed25519
        ssh_key_file: .ssh/id_ed25519

    # Install ZSH Powerlevel10k config
    - name: Copy p10k config
      ansible.builtin.copy:
        src: p10k.zsh
        dest: /home/{{ main_user.username }}/.p10k.zsh
        owner: "{{ main_user.username }}"
        group: "{{ main_user.username }}"
        mode: "0644"
  roles:
    # Install any available package updates
    - role: robertdebock.update
      vars:
        update_reboot: false
      tags: updates

    # Reboot if necessary
    - role: robertdebock.reboot
      tags: updates

    # Set locale
    - role: robertdebock.locale
      vars:
        locale_lang: en_GB.UTF-8

    # Install/configure ZSH
    - role: viasite-ansible.zsh
      vars:
        zsh_user: "{{ main_user.username }}"
        zsh_theme: powerlevel10k

    # Run ssh-agent automatically on login
    - role: wsl_ssh_agent
      vars:
        wsl_ssh_agent_user: "{{ main_user.username }}"
        wsl_ssh_agent_source_files:
          - .bashrc
          - .zshrc.local.pre-p10k
      tags: ssh-agent
