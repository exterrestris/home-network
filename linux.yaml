---
- name: Main - Common
  hosts: all:!pfsense
  tasks:
    # Install packages
    - name: Install common packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ common_packages }}"
      tags: packages

- name: Main - Raspberry Pi - Ubuntu
  hosts: raspberry_pi:&ubuntu
  tasks:
    # Install packages
    - name: Install rasberry pi ubuntu packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ raspberry_pi_ubuntu_packages }}"
      tags: packages
    - name: Remove default "ubuntu" user
      ansible.builtin.user:
        name: ubuntu
        remove: true
        state: absent
    - name: Remove default "ubuntu" group
      ansible.builtin.group:
        name: ubuntu
        state: absent

- name: Main - Standard Linux
  hosts: linux
  roles:
    # Install any available package updates
    - role: robertdebock.update
      vars:
        update_reboot: false
      tags:
        - updates
        - setup
    # Reboot if necessary
    - role: robertdebock.reboot
      tags:
        - updates
        - setup
    # Set up main user
    - role: exterrestris.ansible_users
      vars:
        users: # noqa var-naming[no-role-prefix]
          - "{{ main_user }}"
      tags:
        - users
    # Install/configure ZSH
    - role: viasite-ansible.zsh
      vars:
        zsh_user: "{{ main_user.username }}"
        zsh_theme: powerlevel10k
      tags: zsh
    # Run ssh-agent automatically on login
    - role: ssh_agent
      vars:
        ssh_agent_user: "{{ main_user.username }}"
        ssh_agent_source_files:
          - .bashrc
          - .zshrc.local.pre-p10k
        ssh_agent_keys:
          - ~/.ssh/id_ed25519
    # Configure firewall
    - role: weareinteractive.ufw
      vars:
        ufw_rules: "{{ common_ufw_rules }}"
      tags: firewall
  tasks:
    # Install ZSH Powerlevel10k config
    - name: Copy p10k config
      ansible.builtin.copy:
        src: p10k.zsh
        dest: /home/{{ main_user.username }}/.p10k.zsh
        owner: "{{ main_user.username }}"
        group: "{{ main_user.username }}"
        mode: "0644"
      tags: zsh

- name: Proxmox VE
  hosts: pve
  roles:
    # Remove Proxmox 'unregisted' nag
    - role: ironicbadger.ansible_role_proxmox_nag_removal
      tags: proxmox
    # Disable cluster services to prevent SSD wear
    - role: proxmox_host
      tags: proxmox
  tasks:
    # Copy IOMMU groups script
    - name: Copy iommu.sh script
      ansible.builtin.copy:
        src: iommu.sh
        dest: /root/iommu.sh
        owner: root
        group: root
        mode: "0755"

- name: Proxmox
  hosts: proxmox
  roles:
    # Install SSL certificate
    - role: exterrestris.proxmox_ssl
      tags: ssl
  tasks:
    - name: Install additional packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ proxmox_additional_packages }}"
      tags: packages

- name: Promxox VM
  hosts: proxmox_vm:&linux
  roles:
    # Install qemu-guest-agent
    - role: proxmox_vm

- name: NAS - Common
  hosts: nas
  roles:
    # Set up groups needed for file permissions
    - role: exterrestris.ansible_users
      vars:
        users: "{{ nas_users }}" # noqa var-naming[no-role-prefix]
        groups_to_create: "{{ nas_groups }}" # noqa var-naming[no-role-prefix]
      tags:
        - users
        - nas-users
    # Mount ext4 disks
    - role: mount_disks
  tasks:
    # Add main user to groups created
    - name: Additional groups for main user
      ansible.builtin.user:
        name: "{{ main_user.username }}"
        groups: "{{ nas_groups | map(attribute='name') }}"
        append: true
      tags:
        - users
        - nas-users
    # Install packages
    - name: Install common nas packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ nas_common_packages }}"
      tags: packages

- name: ZFS
  hosts: zfs
  roles:
    # Install/configure ZFS pools
    - role: mrlesmithjr.zfs
      tags:
        - disks
        - zfs
    # Install/configure ZFS snapshots/replication using Sanoid
    - role: exterrestris.sanoid
  tasks:
    - name: Install additional packages
      ansible.builtin.package:
        name: "{{ item.name }}"
        state: present
      with_items: "{{ zfs_additional_packages }}"
      tags: packages

- name: NAS - post ZFS
  hosts: nas
  roles:
    # Install/configure mergerfs
    - role: tigattack.mergerfs
      tags:
        - disks
        - mergerfs

- name: Traefik (non Docker)
  hosts: traefik:!docker
  roles:
    # Install Traefik
    - role: exterrestris.traefik
    # Configure firewall
    - role: weareinteractive.ufw
      vars:
        ufw_rules:
          - "{{ traefik_ufw_rules }}"
      tags:
        - firewall
        - traefik-firewall
    # Install SSL certificate
    - role: exterrestris.fetch_ssl
      tags:
        - traefik-ssl
        - ssl
  tags:
    - traefik

- name: Docker - Setup - non Raspberry Pi
  hosts: docker:!raspberry_pi
  roles:
    # Install Docker (x64)
    - role: geerlingguy.docker
      when: "'raspberry_pi' not in group_names"
  # Install Docker/Docker Compose PIP packages (needed for Ansible to control Docker)
  # - role: geerlingguy.pip
  #   vars:
  #     pip_install_packages:
  #       - name: docker
  #       - name: docker-compose
  tags:
    - docker
    - docker-install

- name: Docker - Setup - Raspberry Pi
  hosts: docker:&raspberry_pi
  roles:
    # # Install PIP
    # - role: geerlingguy.pip
    #   vars:
    #     pip_install_packages:
    #       - name: docker
    #         # geerlingguy.docker_arm will install docker-compose pip package
    # Install Docker (arm)
    - role: geerlingguy.docker_arm
      when: "'raspberry_pi' in group_names"
  tags: docker-install

- name: Docker - Common
  hosts: docker
  roles:
    # Set up users specific to containers
    - role: exterrestris.ansible_users
      vars:
        users: "{{ container_users }}" # noqa var-naming[no-role-prefix]
      tags:
        - container-users
    # Install Traefik
    - role: exterrestris.traefik
      tags:
        - traefik
      when: "'traefik' in group_names"
    # Configure firewall
    - role: weareinteractive.ufw
      vars:
        ufw_rules:
          - "{{ traefik_ufw_rules }}"
          - "{{ docker_ufw_rules }}"
      tags:
        - firewall
        - docker-firewall
    # Install SSL certificate
    - role: exterrestris.fetch_ssl
      tags:
        - traefik
        - traefik-ssl
        - ssl
      when: "'traefik' in group_names"
    # Generate Docker Compose
    - role: exterrestris.docker_compose
      tags:
        - docker-compose
  tags:
    - docker

- name: NAS - post Docker
  hosts: nas
  roles:
    # Install/configure Samba shares/users
    - role: vladgh.samba.server
      tags:
        - samba
    # Configure firewall
    - role: weareinteractive.ufw
      vars:
        ufw_rules: "{{ nas_ufw_rules }}"
      tags: firewall
    # Set up WSDD for network discovery
    - role: exterrestris.wsdd
      tags:
        - wsdd
        - samba
